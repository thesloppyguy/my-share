[package]
name = "my-share"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
bytes = "1.12.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15"
filetime = "0.2.29"
fs2 = "0.4.3"
futures = "0.3.34"
ignore = "0.4.34"
mime_guess = "2.0.5"
notify = "8.2.2"
rayon = "1.12.0"
refinery = "0.10.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
